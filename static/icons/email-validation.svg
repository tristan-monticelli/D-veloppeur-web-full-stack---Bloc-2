<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Validation en cours">
  <style>
    .ring {
      fill: none;
      stroke: #3c87b3;
      stroke-width: 7;
      stroke-linecap: round;
      stroke-dasharray: 70 170;
      transform-origin: 48px 48px;
      animation: spin 1s linear 2, fade-ring 0.3s ease 2s forwards;
    }

    .check {
      fill: none;
      stroke: #2ba27c;
      stroke-width: 8;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 54;
      stroke-dashoffset: 54;
      animation: draw-check 0.45s ease 2s forwards;
    }

    .circle {
      fill: none;
      stroke: #2ba27c;
      stroke-width: 7;
      opacity: 0;
      transform-origin: 48px 48px;
      animation: show-circle 0.25s ease 2s forwards;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fade-ring {
      to { opacity: 0; }
    }

    @keyframes show-circle {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes draw-check {
      to { stroke-dashoffset: 0; }
    }
  </style>
  <circle class="ring" cx="48" cy="48" r="31" />
  <circle class="circle" cx="48" cy="48" r="31" />
  <path class="check" d="M31 49.5 43 61 66 35" />
</svg>
